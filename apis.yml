aid: simpleclub
name: Simpleclub
description: 'Simpleclub is a German digital learning platform serving over two million students (grades 5-13),
  apprentices, and organizations across school, vocational training (Ausbildung), continuing education, retraining,
  and workforce upskilling. The product pairs curriculum-aligned content (including IHK-aligned vocational tracks)
  with an AI-powered learning assistant, trainer/learning-management tooling, and the ability for organizations to
  upload custom content. It counts 750+ corporate clients such as Deutsche Bahn, Bosch, and Vodafone. Simpleclub
  maintains a public GitHub organization of open-source Flutter tooling (math keyboard, flutter_math, design-token
  builder) but publishes no public developer API, developer portal, or machine-readable API specification; this
  profile is an end-user/EdTech company record rather than an API provider.'
